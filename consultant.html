{% extends "base.html" %}{% block content %}<div class="dashhead"><div><p class="eyebrow">CONSULTANT PORTAL</p><h1>Case queue</h1></div></div><div class="table">{% for a in cases %}<div class="row"><div><b>#{{a.id}} · {{a.name}}</b><small>{{a.email}} · {{a.nationality}} → {{a.destination}}</small></div><span>{{a.package}}</span><a href="{{url_for('consultant_case',aid=a.id)}}">Review →</a></div>{% else %}<p>No cases.</p>{% endfor %}</div>{% endblock %}
