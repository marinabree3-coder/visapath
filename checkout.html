{% extends "base.html" %}{% block content %}<div class="checkout"><p class="eyebrow">SECURE CHECKOUT</p><h1>{{details[0]}}</h1><div class="price">${{details[1]}} USD</div><p>{{details[2]}}</p><label>Display currency<select id="currency" onchange="convert()">{% for c in currencies %}<option>{{c}}</option>{% endfor %}</select></label><p id="local"></p><div class="notice">Demo checkout: no real payment is processed in this MVP. Production will connect verified M-Pesa/card payments.</div><form method="post"><button class="btn">Pay & unlock assessment (demo)</button></form></div><script>const rate={{currencies|tojson}}; const usd={{details[1]}}; function convert(){let c=document.getElementById('currency').value;document.getElementById('local').textContent='≈ '+(usd*rate[c]).toLocaleString()+' '+c;}convert();</script>{% endblock %}
